<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <title>Page not found | Elmvale Global</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2a24;
      background: #f7f8f7;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(760px, 100%);
      background: #fff;
      border: 1px solid #e3e7e4;
      border-radius: 28px;
      padding: 48px;
      box-shadow: 0 18px 50px rgba(18, 38, 28, 0.08);
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 44px; }
    .brand img { width: 36px; height: 36px; object-fit: contain; }
    .brand-name { font-family: Georgia, "Times New Roman", serif; letter-spacing: .08em; font-size: 22px; }
    .eyebrow { font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: #7a847e; margin-bottom: 14px; }
    h1 { margin: 0 0 18px; font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(38px, 7vw, 62px); line-height: 1.05; }
    p { margin: 0; color: #5f6a64; font-size: 18px; line-height: 1.65; max-width: 620px; }
    nav { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; }
    a {
      color: #163d30;
      text-decoration: none;
      border: 1px solid #ccd6d0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 14px;
    }
    a.primary { background: #163d30; color: #fff; border-color: #163d30; }
    @media (max-width: 600px) { main { padding: 32px 24px; border-radius: 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/elmvale-logo-256.webp" alt="Elmvale Global" />
      <div class="brand-name">ELMVALE GLOBAL</div>
    </div>
    <div class="eyebrow">404</div>
    <h1 id="title">Page not found</h1>
    <p id="copy">The page you were looking for does not exist or may have moved. You can continue from one of the main Elmvale Global pages below.</p>
    <nav aria-label="Helpful links">
      <a id="home" class="primary" href="/">Home</a>
      <a id="packaging" href="/products/">Packaging</a>
      <a id="sourcing" href="/sourcing/">Sourcing</a>
      <a id="contact" href="/contact/">Contact</a>
    </nav>
  </main>
  <script>
    const isFrench = window.location.pathname.startsWith("/fr/");
    if (isFrench) {
      document.documentElement.lang = "fr";
      document.title = "Page introuvable | Elmvale Global";
      document.getElementById("title").textContent = "Page introuvable";
      document.getElementById("copy").textContent = "La page recherchée n’existe pas ou a peut-être été déplacée. Vous pouvez continuer depuis l’une des pages principales d’Elmvale Global ci-dessous.";
      const links = {
        home: ["/fr/", "Accueil"],
        packaging: ["/fr/products/", "Packaging"],
        sourcing: ["/fr/sourcing/", "Sourcing"],
        contact: ["/fr/contact/", "Contact"]
      };
      Object.entries(links).forEach(([id, value]) => {
        const node = document.getElementById(id);
        node.href = value[0];
        node.textContent = value[1];
      });
    }
  </script>
</body>
</html>
